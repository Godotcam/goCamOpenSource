apiVersion: v1
kind: Service
metadata:
  name: {{ include "gocam.fullname" . }}
  labels:
    {{- include "gocam.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gocam.selectorLabels" . | nindent 4 }}
